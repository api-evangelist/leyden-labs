aid: leyden-labs
name: Leyden Labs
description: 'Leyden Labs is a clinical-stage biotechnology company headquartered in Leiden,
  The Netherlands, with a regional office in Singapore, developing intranasal antibody products
  that protect people against known and newly emerging respiratory viruses. Its approach pairs
  mucosal immunity — delivering antibodies directly into the nasal passages, the gateway
  respiratory viruses use to enter the body — with broad protection, by targeting conserved
  regions of viral proteins so a single product can cover circulating strains and future
  variants. Its lead program, PanFlu, is an intranasal antibody candidate in clinical trials
  derived from CR9114, among the most broadly neutralizing influenza antibodies identified to
  date. Founded in 2021 by Koenraad Wiedhaup and Ronald Brus with founding scientist Jaap
  Goudsmit, the company is backed by GV and the SoftBank Vision Fund alongside the European
  Innovation Council Fund, the European Investment Bank and Invest-NL. Leyden Labs publishes
  no public developer program, API, or SDK; this profile captures its public web, security and
  identity surface for the API Evangelist network.'
